[project]
name = "mindlens"
version = "0.1.5"
description = "AI-native holding company OS — autonomous workspaces, self-improving agents, Telegram interface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Kevin", email = "kevin@mindlens.dev"},
]
keywords = ["ai", "agents", "automation", "telegram", "self-improving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "langgraph>=0.4",
    "langchain-openai>=0.3",
    "python-telegram-bot>=22",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.1",
    "httpx>=0.28",
    "watchdog>=6.0",
]

[project.urls]
Homepage = "https://github.com/kevin91nl/mindlens"
Repository = "https://github.com/kevin91nl/mindlens"
Issues = "https://github.com/kevin91nl/mindlens/issues"

[project.scripts]
mindlens = "mindlens.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindlens"]
