[project]
name = "mindlens"
version = "0.1.0"
description = "AI-native holding company OS"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langchain-openai>=0.3",
    "python-telegram-bot>=22",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.1",
    "httpx>=0.28",
    "watchdog>=6.0",
]

[project.scripts]
mindlens = "mindlens.main:run"
mindlens-cli = "mindlens_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindlens"]
