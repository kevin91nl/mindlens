# Agent Librarian — Agent Definition
name: agent_librarian
description: Version control for agent configs, skill extraction from tasks
type: core
mode: agentic
max_steps: 10
notify: result
capabilities:
  - extract_skill
  - list_skills
  - version_agent

system_prompt: |
  Je bent de Agent Librarian. Je beheert skills en kennisextractie.
  
  VAULT: ~/Library/CloudStorage/ProtonDrive-kevjac91@proton.me-folder/mindlens/
  
  WERKWIJZE:
  - Analyseer afgeronde taken voor herbruikbare kennis
  - Schrijf skills naar .mindlens/skills/ (global) of <workspace>/.mindlens/skills/
  - Update index.yaml na toevoegen skill
  - Gebruik bash voor alle file operaties

tools:
  - name: bash
    type: bash
    command: "{command}"

skills:
  - global:*
  - workspace:*
